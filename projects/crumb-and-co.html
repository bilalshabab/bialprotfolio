<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crumb &amp; Co. Bakery — Project</title>
  <style>
    * { box-sizing: border-box; }
    body { margin:0; font-family:Arial,Helvetica,sans-serif; background:#080b09; color:#fff; padding:40px 20px 70px; }
    .wrap { max-width:1100px; margin:auto; }
    .back { display:inline-block; color:#fff; text-decoration:none; margin-bottom:28px; opacity:.8; }
    h1 { margin:0 0 10px; font-size:clamp(34px,6vw,64px); }
    .intro { color:#b8c0ba; margin:0 0 35px; font-size:17px; }
    .gallery { display:grid; gap:28px; }
    .gallery img { width:100%; height:auto; display:block; border-radius:18px; box-shadow:0 20px 60px rgba(0,0,0,.35); }
    .menu { border-radius:18px; overflow:hidden; background:#fff; box-shadow:0 20px 60px rgba(0,0,0,.35); }
    .menu iframe { width:100%; height:800px; border:0; display:block; }
    .pdf-link { display:block; padding:16px 20px; color:#111; background:#fff; font-weight:700; text-decoration:none; }
  </style>
</head>
<body>
  <main class="wrap">
    <a class="back" href="../index.html">← Back to Portfolio</a>
    <h1>Crumb &amp; Co. Bakery</h1>
    <p class="intro">Bakery Brand · Graphic Design · Social Media · Creative</p>
    <div class="gallery">
      <img src="../assets/projects/crumb-and-co.jpg" alt="Crumb and Co. bakery croissant creative">
      <img src="../assets/projects/crumb-and-co-2.png" alt="Crumb and Co. bakery bread creative">
      <img src="../assets/projects/crumb-and-co-3.png" alt="Crumb and Co. bakery muffins creative">
      <img src="../assets/projects/crumb-and-co-logo.png" alt="Crumb and Co. Bakery logo">
      <div class="menu">
        <iframe src="../assets/projects/crumb-and-co-breakfast-menu.pdf" title="Crumb and Co. breakfast menu"></iframe>
        <a class="pdf-link" href="../assets/projects/crumb-and-co-breakfast-menu.pdf" target="_blank" rel="noopener">Open Breakfast Menu PDF ↗</a>
      </div>
    </div>
  </main>
</body>
</html>
