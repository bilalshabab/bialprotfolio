<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Viking Restaurant — Project</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #080b09;
      color: #fff;
      padding: 40px 20px 70px;
    }
    .wrap { max-width: 1100px; margin: auto; }
    .back {
      display: inline-block;
      color: #fff;
      text-decoration: none;
      margin-bottom: 28px;
      opacity: .8;
    }
    h1 { margin: 0 0 10px; font-size: clamp(34px, 6vw, 64px); }
    .intro { color: #b8c0ba; margin: 0 0 35px; font-size: 17px; }
    .gallery { display: grid; gap: 28px; }
    .gallery img, .gallery video {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 18px;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
      background: #000;
    }
    .gallery video { max-height: 760px; }
  </style>
</head>
<body>
  <main class="wrap">
    <a class="back" href="../index.html">← Back to Portfolio</a>
    <h1>Viking Restaurant</h1>
    <p class="intro">Restaurant · Creative Design · Social Media · AI Creatives</p>

    <div class="gallery">
      <img src="../assets/projects/viking-restaurant.jpg" alt="Viking Restaurant creative">

      <video controls preload="metadata" playsinline>
        <source src="../assets/videos/viking-breakfast-1.mp4" type="video/mp4">
      </video>

      <video controls preload="metadata" playsinline>
        <source src="../assets/videos/viking-breakfast-2.mp4" type="video/mp4">
      </video>

      <video controls preload="metadata" playsinline>
        <source src="../assets/videos/viking-breakfast-3.mp4" type="video/mp4">
      </video>
    </div>
  </main>
</body>
</html>
